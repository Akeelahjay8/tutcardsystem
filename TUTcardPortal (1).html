<script>
// ===== STORAGE CAPACITY UPGRADE (kept) =====
(function () {
  var REG_KEY = 'tut_card_registrations';
  var DB_NAME = 'tut_card_storage_db';
  var DB_STORE = 'kv';
  var originalGetItem = Storage.prototype.getItem;
  var originalSetItem = Storage.prototype.setItem;
  if (!('indexedDB' in window)) return;
  var memCache = null;
  try { memCache = originalGetItem.call(localStorage, REG_KEY); } catch (e) { memCache = null; }
  if (memCache === null) memCache = '[]';
  var dbPromise = null;
  function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise(function(res,rej){var r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbPromise;}
  function idbGet(k){return openDB().then(function(db){return new Promise(function(res){try{var tx=db.transaction(DB_STORE,'readonly');var req=tx.objectStore(DB_STORE).get(k);req.onsuccess=function(){res(req.result===undefined?null:req.result);};req.onerror=function(){res(null);};}catch(e){res(null);}});}).catch(function(){return null;});}
  function idbSet(k,v){return openDB().then(function(db){return new Promise(function(res){try{var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};}catch(e){res(false);}});}).catch(function(){return false;});}
  idbGet(REG_KEY).then(function(s){if(typeof s==='string')memCache=s;else if(memCache&&memCache!=='[]')idbSet(REG_KEY,memCache);});
  Storage.prototype.getItem=function(k){if(k===REG_KEY)return memCache;return originalGetItem.call(this,k);};
  Storage.prototype.setItem=function(k,v){if(k===REG_KEY){memCache=String(v);idbSet(REG_KEY,memCache);return;}return originalSetItem.call(this,k,v);};
})();
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#222;min-height:100vh}
:root{--primary:#003580;--accent:#f39c12;--danger:#c0392b;--success:#27ae60;--light:#f8f9fa;--border:#dee2e6}

.step-item{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#999}
.step-label{font-size:.78rem;color:#999;font-weight:500}
.step-item.active.step-circle{background:var(--primary);border-color:var(--primary);color:#fff}
.step-item.active.step-label{color:var(--primary);font-weight:700}
.step-item.done.step-circle{background:var(--success);border-color:var(--success);color:#fff}
.step-connector{width:32px;height:2px;background:var(--border);flex-shrink:0;margin:0 2px}
.main{max-width:820px;margin:32px auto;padding:0 16px 80px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:32px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:.85rem;font-weight:600;color:#444}
input,select{padding:10px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.93rem;width:100%}

.upload-item.uploaded{border-color:var(--success);background:#f0faf4;border-style:solid}
.btn{display:inline-flex;padding:11px 24px;border-radius:8px;border:none;cursor:pointer;font-weight:600}

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCwzyHmj1sDrMNSXX-yyVTBe5MtMreyubE",authDomain:"tutcardsystem.firebaseapp.com",projectId:"tutcardsystem",storageBucket:"tutcardsystem.firebasestorage.app",messagingSenderId:"999430164426",appId:"1:999430164426:web:684bda06ef8f8a2f63c933"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== YOUR ORIGINAL LOGIC KEPT 100% =====
let currentStep = 0;
let formData = { type:'', firstName:'', lastName:'', studentNo:'', campus:'', email:'', photo:'', idDoc:'' };
const steps = ['Type','Details','Documents','Preview','Success'];

function renderSteps(){
 let h=''; steps.forEach((s,i)=>{
  h+=`<div class="step-item ${i==currentStep?'active':''} ${i<currentStep?'done':''}"><div class="step-circle">${i<currentStep?'✓':i+1}</div><div class="step-label">${s}</div></div>`;
  if(i<steps.length-1) h+=`<div class="step-connector ${i<currentStep?'done':''}"></div>`;
 }); document.getElementById('stepBar').innerHTML=h;
}
function render(){
 renderSteps();
 const c=document.getElementById('mainCard');
 if(currentStep==0){
  c.innerHTML=`<h2>Select Card Type</h2><p style="color:#666;margin-bottom:20px">Protected system © 223037682</p><div class="type-cards"><div class="type-card ${formData.type=='Student'?'selected':''}" onclick="selectType('Student')"><div style="font-size:2rem">🎓</div><h3>Student</h3><p>New/Renewal</p></div><div class="type-card ${formData.type=='Staff'?'selected':''}" onclick="selectType('Staff')"><div style="font-size:2rem">💼</div><h3>Staff</h3><p>Employee Card</p></div></div><div class="btn-group"><button class="btn btn-primary" onclick="nextStep()">Continue →</button></div>`;
 }
 else if(currentStep==1){
  c.innerHTML=`<h2>Your Details</h2><div class="form-grid"><div class="form-group"><label>First Name *</label><input id="fn" value="${formData.firstName}"></div><div class="form-group"><label>Last Name *</label><input id="ln" value="${formData.lastName}"></div><div class="form-group"><label>Student No *</label><input id="sn" value="${formData.studentNo}"></div><div class="form-group"><label>Campus *</label><select id="cp"><option value="">Select</option><option ${formData.campus=='Pretoria'?'selected':''}>Pretoria</option><option ${formData.campus=='Soshanguve South'?'selected':''}>Soshanguve South</option><option ${formData.campus=='Soshanguve North'?'selected':''}>Soshanguve North</option><option ${formData.campus=='Ga-Rankuwa'?'selected':''}>Ga-Rankuwa</option><option ${formData.campus=='Emalahleni'?'selected':''}>Emalahleni</option><option ${formData.campus=='Polokwane'?'selected':''}>Polokwane</option><option ${formData.campus=='Mbombela'?'selected':''}>Mbombela</option></select></div><div class="form-group full"><label>Email</label><input id="em" value="${formData.email}"></div></div><div class="btn-group"><button class="btn" onclick="prevStep()">← Back</button><button class="btn btn-primary" onclick="saveDetails()">Continue →</button></div>`;
 }
 else if(currentStep==2){
  c.innerHTML=`<h2>Upload Documents</h2><div style="margin-top:16px"><div class="upload-item ${formData.photo?'uploaded':''}"><div>📸</div><div style="flex:1"><div style="font-weight:600">ID Photo *</div><div style="font-size:12px;color:#888">${formData.photo?'Uploaded ✓':'Required'}</div></div><label class="btn btn-primary" style="padding:6px 12px;font-size:12px"><input type="file" accept="image/*" hidden onchange="uploadPhoto(this)">Upload</label></div><div class="upload-item ${formData.idDoc?'uploaded':''}"><div>🪪</div><div style="flex:1"><div style="font-weight:600">ID Document *</div><div style="font-size:12px;color:#888">${formData.idDoc?'Uploaded ✓':'Required'}</div></div><label class="btn btn-primary" style="padding:6px 12px;font-size:12px"><input type="file" accept="image/*,.pdf" hidden onchange="uploadId(this)">Upload</label></div></div><div class="btn-group"><button class="btn" onclick="prevStep()">← Back</button><button class="btn btn-primary" onclick="nextStep()">Preview →</button></div>`;
 }
 else if(currentStep==3){
  c.innerHTML=`<h2>Preview Your Card</h2><p style="text-align:center;color:#666;font-size:13px;margin:10px 0">This is how your card will look - Your Vision</p><div style="display:flex;justify-content:center;padding:10px"><div class="id-card"><div class="id-card-main"><div class="id-card-left"><div style="font-size:11px;font-weight:700;color:#003087">Tshwane University of Technology</div><div class="id-card-role">${formData.type||'STUDENT'}</div><div style="font-size:14px;font-weight:800;margin-top:8px">${formData.firstName} ${formData.lastName}</div><div style="font-size:13px;font-weight:700">${formData.studentNo}</div><div style="font-size:13px;font-weight:700">${formData.campus}</div></div><div style="width:120px;height:140px;background:#ccc;border:1px solid #999;overflow:hidden">${formData.photo?`<img src="${formData.photo}" style="width:100%;height:100%;object-fit:cover">`:'<div style="display:flex;align-items:center;justify-content:center;height:100%">No Photo</div>'}</div></div><div style="text-align:center;font-size:10px;padding:5px;background:#f0f0ec">PROTECTED © MJ RAMANNA 223037682</div></div></div><div class="btn-group" style="justify-content:center"><button class="btn" onclick="prevStep()">← Back</button><button class="btn btn-primary" id="submitBtn" onclick="finalSubmit()">✅ Submit to Cloud</button></div>`;
 }
 else if(currentStep==4){
  c.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:4rem">✅</div><h2>Saved to CLOUD!</h2><div class="ref-box"><div style="font-size:11px;color:#666">REFERENCE</div><div style="font-size:22px;font-weight:900;color:#003580">TUT-${formData.studentNo}</div></div><p style="margin-top:16px;color:#444">Your application is now visible to ALL admins live! Protected © 223037682</p><button class="btn btn-primary" style="margin-top:20px" onclick="location.reload()">New Application</button></div>`;
 }
}
window.selectType=(t)=>{formData.type=t;render();};
window.nextStep=()=>{if(currentStep==0&&!formData.type)return alert('Select type'); currentStep++; render();};
window.prevStep=()=>{currentStep--; render();};
window.saveDetails=()=>{
 formData.firstName=document.getElementById('fn').value;
 formData.lastName=document.getElementById('ln').value;
 formData.studentNo=document.getElementById('sn').value;
 formData.campus=document.getElementById('cp').value;
 formData.email=document.getElementById('em').value;
 if(!formData.firstName||!formData.lastName||!formData.studentNo||!formData.campus)return alert('Fill all * fields');
 nextStep();
};
window.uploadPhoto=(i)=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=(e)=>{formData.photo=e.target.result;render();};r.readAsDataURL(f);};
window.uploadId=(i)=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=(e)=>{formData.idDoc=e.target.result;render();};r.readAsDataURL(f);};

window.finalSubmit=async()=>{
 const btn=document.getElementById('submitBtn');
 btn.disabled=true; btn.innerText='Saving to Cloud...';
 try{
  // Save to local for backup
  let regs=JSON.parse(localStorage.getItem('tut_card_registrations')||'[]');
  let rec={id:Date.now(),...formData,status:'pending',createdAt:new Date().toISOString(),protectedBy:'MJ Ramanna 223037682'};
  regs.push(rec); localStorage.setItem('tut_card_registrations',JSON.stringify(regs));
  // Save to CLOUD - All admins see!
  await addDoc(collection(db,"applications"),{
    fullName:formData.firstName+' '+formData.lastName,
    firstName:formData.firstName, lastName:formData.lastName,
    studentNo:formData.studentNo, campus:formData.campus, email:formData.email,
    type:formData.type, photo:formData.photo||'', idDoc:formData.idDoc||'',
    status:'pending', createdAt:serverTimestamp(), protectedBy:'223037682'
  });
  currentStep=4; render();
 }catch(e){alert('Error: '+e.message); btn.disabled=false; btn.innerText='Try Again';}
};
render();
</script>
