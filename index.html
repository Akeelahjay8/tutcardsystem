<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUT Card Management System</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f6fa;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    width: 180px;
    height: auto;
    margin: 0 auto 20px;
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #6b7280; margin: 0 0 28px; font-size: 14px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.btn {
    display: block;
    padding: 14px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  a.btn:hover { transform: translateY(-1px); opacity: 0.92; }
  .primary { background: #0a3d91; color: #fff; }
  .secondary { background: #eef1f7; color: #0a3d91; border: 1px solid #d7dcea; }
  footer { margin-top: 28px; font-size: 12px; color: #9aa1b1; }
</style>
</head>
