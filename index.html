<!DOCTYPE html>
<html>
<head>
<title>TUT Card System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --tut-blue:#1b4f9c;
  --tut-red:#c8102e;
  --tut-gold:#f2a900;
}
body{font-family:Arial;background:#000;color:white;text-align:center;padding:40px}
.logo{width:150px;height:auto;margin-bottom:6px}
h1{color:var(--tut-blue);letter-spacing:1px}
.tagline{color:var(--tut-red);font-style:italic;font-weight:bold;margin-top:-6px;margin-bottom:24px}
.card{background:white;color:#111;padding:30px;border-radius:15px;max-width:500px;margin:20px auto;box-shadow:0 0 25px rgba(27,79,156,.4)}
a.btn{display:block;color:white;padding:15px;margin:15px;border-radius:10px;text-decoration:none;font-weight:bold;transition:.2s}
a.btn.portal{background:var(--tut-blue)}
a.btn.portal:hover{background:#153f7d}
a.btn.admin{background:var(--tut-red)}
a.btn.admin:hover{background:#a20d25}
.card p{color:var(--tut-gold);font-weight:bold;margin-top:10px}
</style>
</head>
